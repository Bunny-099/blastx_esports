name: blastix_esports
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  pushable_button: ^0.0.4
  perspective_space: ^0.1.2
  curved_labeled_navigation_bar: ^2.0.6
  intl: ^0.20.3
  shimmer: ^4.0.0
  flutter_animate: ^4.5.2
  dio: ^5.11.1
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.4
  share_plus: ^12.0.2
  image_picker: ^1.1.2
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.1
  google_sign_in: ^6.2.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  device_info_plus: ^11.3.0
  package_info_plus: ^8.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logos/app_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svg/
    - assets/json/
    - assets/audio/
    - assets/icons/
    - assets/logos/
    - assets/lottie/
    - assets/videos/
    - assets/animations/