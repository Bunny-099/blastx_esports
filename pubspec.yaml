name: blastx_esports
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  pushable_button: ^0.0.4
  perspective_space: ^0.1.2
  curved_labeled_navigation_bar: ^2.0.6
  intl: ^0.20.3
  shimmer: ^4.0.0
  flutter_animate: ^4.5.2
  dio: ^5.11.1
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.4
  share_plus: ^12.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svg/
    - assets/json/
    - assets/audio/
    - assets/icons/
    - assets/logos/
    - assets/lottie/
    - assets/videos/
    - assets/animations/